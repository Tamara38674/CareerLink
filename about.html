
<script>
  // Remove the original CareerMatch chatbot
  function removeOldChatbot() {
    document.getElementById("chatLaunch")?.remove();
    document.getElementById("chatBox")?.remove();
  }

  document.addEventListener("DOMContentLoaded", () => {
    removeOldChatbot();
    setTimeout(removeOldChatbot, 500);
    setTimeout(removeOldChatbot, 1500);
  });
</script>
